services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
      # No defaults: the API refuses to start without a JWT_SECRET (set both
      # in .env; see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_CLIENTS: ${AUTH_CLIENTS:-}
      # Read text from scanned PDF pages (needs the image built with INSTALL_OCR=true).
      OCR_ENABLED: ${OCR_ENABLED:-false}
      # Start a chunk at each numbered paragraph heading (affects new ingests only).
      CHUNK_BY_PARAGRAPH: ${CHUNK_BY_PARAGRAPH:-false}
      PDF_REPAIR_SPLIT_WORDS: ${PDF_REPAIR_SPLIT_WORDS:-false}
      # Retrieval switches. Measure a change with python -m evals.doc_eval first.
      HYBRID_ENABLED: ${HYBRID_ENABLED:-false}
      MAX_DISTANCE: ${MAX_DISTANCE:-0.48}
      # Once a question passes MAX_DISTANCE, read chunks up to this far (blank = same).
      CONTEXT_MAX_DISTANCE: ${CONTEXT_MAX_DISTANCE:-}
      # Also give the model the chunk(s) after each retrieved one (0 = off), and
      # the context window it is asked to use (raise it before raising the first).
      CONTEXT_NEIGHBORS: ${CONTEXT_NEIGHBORS:-0}
      CONTEXT_MAX_CHUNKS: ${CONTEXT_MAX_CHUNKS:-8}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-4096}
      # Checks on the answer: figures versus the cited passages, and question words
      # no document contains. See README, "Checking the answer".
      VERIFY_MODE: ${VERIFY_MODE:-flag}
      ANSWERABILITY_MODE: ${ANSWERABILITY_MODE:-off}
      ANSWERABILITY_MIN_CHUNKS: ${ANSWERABILITY_MIN_CHUNKS:-1}
      ANSWERABILITY_MIN_UNKNOWN: ${ANSWERABILITY_MIN_UNKNOWN:-1}
      ANSWER_CHECK: ${ANSWER_CHECK:-off}

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: