name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: aerointel_test
          POSTGRES_USER: aerointel
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerointel -d aerointel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: aerointel_test
      POSTGRES_USER: aerointel
      POSTGRES_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (unit + Postgres integration, no Ollama)
        run: pytest -m "not local" -v

      # The eval harness is the scoreboard for retrieval quality. Real
      # numbers need EmbeddingGemma and are produced locally with
      # `python -m evals.run_eval`; what CI guards is that the harness
      # itself still runs — a silently broken scoreboard is how a quality
      # regression reaches main with nobody noticing.
      - name: Eval harness smoke test
        run: pytest tests/test_eval_harness.py tests/test_eval_metrics.py tests/test_faithfulness.py -v
